[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-strategy-lab"
version = "2.1.0"
description = "Historical F1 modelling, chronological evaluation and an interactive strategy sandbox"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "Akram"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pandas==2.2.2", "numpy==1.26.4", "scikit-learn==1.4.1.post1", "joblib==1.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
